<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Surprise ✨</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foreground: '#ffffff',
                        primary: '#d359b3',
                        accent: '#904dd9',
                        secondary: '#2d1433',
                        rose: '#ff3366',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background-color: #0b0410;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Stars & Grid Overlay */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        /* 3RD: PARTICLE LAYER */
        .particle-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(211, 89, 179, 0.8);
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0.2; }
            50% { opacity: 0.8; transform: translateY(-20px) scale(1.2); }
            100% { transform: translateY(-40px) scale(1); opacity: 0.2; }
        }

        /* Glow Button */
        .glow-btn {
            background: linear-gradient(90deg, #d359b3, #904dd9);
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(211, 89, 179, 0.5);
            transition: all 0.3s ease;
            position: relative;
            z-index: 20;
        }
        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(211, 89, 179, 0.8);
        }

        .text-gradient {
            background: linear-gradient(90deg, #ff8da1, #c874ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Screen Transitions */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10;
            padding: 20px;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
        }

        /* 4TH: ENVELOPE STYLING */
        .envelope-container {
            position: relative;
            width: min(90vw, 320px);
            height: 210px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 15;
            margin-top: 10px;
        }
        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
        }
        .envelope-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #4a1259, #23062d);
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .envelope-front {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #711f88, #400c52);
            clip-path: polygon(0 35%, 50% 65%, 100% 35%, 100% 100%, 0% 100%);
            border-radius: 8px;
            z-index: 3;
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(135deg, #8a27a6, #53116a);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            z-index: 4;
            transition: transform 0.6s ease;
            display: flex;
            justify-content: center;
        }
        .wax-seal {
            position: absolute;
            bottom: 10px;
            width: 42px;
            height: 42px;
            background: radial-gradient(circle, #ff3b68, #9e0022);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wax-seal::after { content: '❤️'; font-size: 1rem; }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            right: 15px;
            background: #fffdfa;
            border-radius: 6px;
            z-index: 2;
            padding: 20px;
            text-align: left;
            transition: transform 0.8s ease 0.3s, max-height 0.8s ease 0.3s;
            max-height: 180px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .letter-title {
            font-family: 'Playfair Display', serif;
            color: #904dd9;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .letter-body {
            color: #333;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Envelope Open Animation */
        .envelope-container.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-container.open .wax-seal { opacity: 0; }
        .envelope-container.open .letter {
            transform: translateY(-40px);
            max-height: 280px;
            z-index: 5;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .envelope-instruction {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }

        /* 5TH: 10-SECOND SLOW FADE TO BLACK OVERLAY */
        #black-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
            transition: opacity 10s linear; /* Exact 10 seconds slow transition */
        }
        #black-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .ambient-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            z-index: 1;
        }
        .b-1 { top: 15%; left: 20%; width: 120px; height: 120px; background: #d359b3; }
        .b-3 { top: 60%; right: 20%; width: 150px; height: 150px; background: #904dd9; }
        .b-5 { bottom: 10%; left: 30%; width: 100px; height: 100px; background: #ff3366; }
    </style>
</head>
<body>

    <!-- 5TH STEP: BLACK OVERLAY (10 SEC FADE) -->
    <div id="black-overlay"></div>

    <!-- 3RD: PARTICLE BACKGROUND LAYER -->
    <div class="particle-layer" aria-hidden="true">
        <span class="particle" style="left: 18.1908%; top: 45.0912%; width: 4.8px; height: 4.8px; animation-duration: 9.2s;"></span>
        <span class="particle" style="left: 5.34426%; top: 92.6576%; width: 4.6px; height: 4.6px; animation-duration: 14.2s;"></span>
        <span class="particle" style="left: 96.1626%; top: 22.4494%; width: 3px; height: 3px; animation-duration: 17.5s;"></span>
        <span class="particle" style="left: 8.82208%; top: 0.884407%; width: 4px; height: 4px; animation-duration: 9.2s;"></span>
        <span class="particle" style="left: 45.3384%; top: 88.6154%; width: 5.6px; height: 5.6px; animation-duration: 17.5s;"></span>
        <span class="particle" style="left: 81.7691%; top: 54.0176%; width: 5.5px; height: 5.5px; animation-duration: 12.3s;"></span>
        <span class="particle" style="left: 68.8509%; top: 62.8911%; width: 3.4px; height: 3.4px; animation-duration: 18.1s;"></span>
        <span class="particle" style="left: 26.1702%; top: 20.0154%; width: 3.2px; height: 3.2px; animation-duration: 14.4s;"></span>
        <span class="particle" style="left: 76.5112%; top: 83.5334%; width: 5px; height: 5px; animation-duration: 12.3s;"></span>
        <span class="particle" style="left: 61.6583%; top: 26.156%; width: 3.3px; height: 3.3px; animation-duration: 12.2s;"></span>
    </div>

    <!-- 1ST SCREEN: INTRO (UPDATED WITH NEW TEXT) -->
    <div id="screen-1" class="screen active">
        <div class="relative z-10 flex w-full max-w-md flex-col items-center gap-6 text-center">
            <div class="min-h-[9rem] space-y-4">
                <p class="font-display text-3xl text-foreground">Hey... 👀</p>
                <p class="font-sans text-base text-foreground/80 font-medium">Today is your birthday 🎉🥂</p>
                <p class="font-sans text-base text-foreground/80 font-medium">Quickly click below now, it's a surprise. 🤫❤️</p>
            </div>
            <div>
                <button type="button" id="btn-screen-1" class="glow-btn" tabindex="0">
                    <span class="relative z-10">Click Here ✨</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2ND SCREEN: GIFT BOX -->
    <div id="screen-2" class="screen">
        <div class="relative z-10 flex w-full max-w-md flex-col items-center gap-9 text-center">
            <p class="font-display text-2xl leading-snug text-foreground">
                This one's specially for you, <span class="text-gradient" id="giftName">Shivani</span> 🎁
            </p>
            <div class="relative h-56 w-56">
                <div class="absolute inset-0">
                    <!-- Gift Box Lid -->
                    <div class="absolute top-8 left-1/2 h-10 w-48 -translate-x-1/2 rounded-xl border border-white/25 bg-gradient-to-b from-primary to-accent shadow-[0_0_50px_-10px_var(--primary)]">
                        <span class="absolute -top-6 left-1/2 h-8 w-8 -translate-x-1/2 rounded-full border-4 border-rose/80"></span>
                        <span class="absolute top-0 left-1/2 h-full w-4 -translate-x-1/2 bg-rose/70"></span>
                    </div>
                    <!-- Gift Box Base -->
                    <div class="absolute bottom-6 left-1/2 h-32 w-44 -translate-x-1/2 overflow-hidden rounded-2xl border border-white/20 bg-gradient-to-b from-secondary to-background shadow-[0_20px_60px_-20px_black]">
                        <span class="absolute top-0 left-1/2 h-full w-4 -translate-x-1/2 bg-gradient-to-b from-primary to-accent opacity-90"></span>
                        <span class="absolute top-1/2 left-0 h-3 w-full -translate-y-1/2 bg-gradient-to-r from-primary/70 to-accent/70"></span>
                    </div>
                </div>
            </div>
            <button type="button" id="btn-screen-2" class="glow-btn" tabindex="0">
                <span class="relative z-10">Unwrap it 🎀</span>
            </button>
        </div>
    </div>

    <!-- 4TH SCREEN: ENVELOPE / CARD -->
    <div id="screen-3" class="screen">
        <div class="ambient-shape b-1"></div>
        <div class="ambient-shape b-3"></div>
        <div class="ambient-shape b-5"></div>

        <div class="container flex flex-col items-center text-center">
            <h2 class="happy-birthday font-display text-2xl text-foreground mb-6" id="env-title">A Special Note For You</h2>

            <div class="envelope-container" id="envelope-btn">
                <div class="envelope">
                    <div class="envelope-back"></div>

                    <div class="letter">
                        <h3 class="letter-title">Dear <span id="letterName">PRIYA</span>,</h3>
                        <p class="letter-body" id="letterMsg">Wishing you a very Happy Birthday! May your day be filled with lots of love, joy, and wonderful moments. 🎉🎂✨</p>
                    </div>

                    <div class="envelope-front"></div>
                    <div class="envelope-flap">
                        <div class="wax-seal"></div>
                    </div>
                </div>
            </div>

            <div class="envelope-instruction" id="env-instruction">Tap envelope to open 💌</div>
            <button id="close-letter-btn" class="glow-btn mt-6 hidden">Close Surprise ✨</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Confetti Burst Trigger
        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#d359b3', '#904dd9', '#ff3366', '#ffffff']
                });
            }
        }

        // Screen 1 -> Screen 2 Transition
        document.getElementById('btn-screen-1').addEventListener('click', function() {
            document.getElementById('screen-1').classList.remove('active');
            setTimeout(() => {
                document.getElementById('screen-2').classList.add('active');
                fireConfetti();
            }, 400);
        });

        // Screen 2 -> Screen 4 (Envelope) Transition
        document.getElementById('btn-screen-2').addEventListener('click', function() {
            document.getElementById('screen-2').classList.remove('active');
            setTimeout(() => {
                document.getElementById('screen-3').classList.add('active');
                fireConfetti();
            }, 400);
        });

        // Open Envelope Action
        const envelopeBtn = document.getElementById('envelope-btn');
        envelopeBtn.addEventListener('click', function() {
            if (!this.classList.contains('open')) {
                this.classList.add('open');
                document.getElementById('env-title').style.opacity = '0.3';
                document.getElementById('env-instruction').style.opacity = '0';
                
                fireConfetti();

                // Show close button after card opens
                setTimeout(() => {
                    const closeBtn = document.getElementById('close-letter-btn');
                    closeBtn.classList.remove('hidden');
                }, 1200);
            }
        });

        // 5TH STEP: Slow 10-Second Fade to Black Trigger
        document.getElementById('close-letter-btn').addEventListener('click', function() {
            const overlay = document.getElementById('black-overlay');
            
            // Activate overlay to start 10-second fade animation
            overlay.classList.add('active');
        });
    </script>
</body>
</html>
