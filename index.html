<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #1b0a1d; color: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .container { background: #2d1433; padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 20px; }
        h2 { text-align: center; color: #ff7eb3; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #fce7f3; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid rgba(255, 126, 179, 0.3); background: rgba(0,0,0,0.2); color: white; font-size: 1rem; }
        textarea { resize: vertical; height: 120px; }
        button { width: 100%; background: linear-gradient(90deg, #d359b3, #904dd9); border: none; padding: 15px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(211, 89, 179, 0.5); }
        .result-box { display: none; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-top: 10px; word-break: break-all; font-size: 0.85rem; border: 1px dashed #a020f0; }
        .result-title { font-size: 0.8rem; color: #ff7eb3; margin-bottom: 5px; }
        .links-section { margin-top: 30px; border-top: 1px solid rgba(255,126,179,0.2); padding-top: 20px; }
        .links-section h3 { color: #ff7eb3; margin-bottom: 15px; font-size: 1rem; }
        .link-item { background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-left: 3px solid #d359b3; }
        .link-item .link-info { flex: 1; min-width: 0; }
        .link-item .link-name { font-weight: 600; color: #ff7eb3; font-size: 0.9rem; }
        .link-item .link-url { font-size: 0.7rem; color: rgba(255,255,255,0.6); word-break: break-all; }
        .link-item .link-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .link-item .delete-btn { background: #ff3366; border: none; padding: 6px 14px; border-radius: 5px; color: white; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .link-item .delete-btn:hover { background: #cc0033; transform: scale(1.05); }
        .link-item .copy-btn { background: #a020f0; border: none; padding: 6px 14px; border-radius: 5px; color: white; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .link-item .copy-btn:hover { background: #7a1ab0; transform: scale(1.05); }
        .no-links { color: rgba(255,255,255,0.4); text-align: center; font-size: 0.9rem; padding: 20px 0; }
        .clear-all-btn { background: #ff3366; border: none; padding: 10px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 0.85rem; width: 100%; }
        .clear-all-btn:hover { background: #cc0033; transform: translateY(-2px); }
        .stats { display: flex; justify-content: space-between; color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-bottom: 15px; }
        #generatedUrl { color: #a020f0; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎂 Birthday Link Generator</h2>
        
        <label>Friend's Name:</label>
        <input type="text" id="friendName" placeholder="e.g. Rahul, Priya..." autocomplete="off">
        
        <label>Custom Message:</label>
        <textarea id="customMessage" placeholder="Type your special birthday wishes here..."></textarea>
        
        <button onclick="generateLink()">Generate Link 🔗</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">✅ Link Generated! Copy and send:</div>
            <p id="generatedUrl" style="margin-bottom: 15px;"></p>
            <button onclick="copyLink()" style="padding: 10px; background: #a020f0;">Copy Link 📋</button>
        </div>

        <div class="links-section">
            <h3>📋 Active Links (<span id="linkCount">0</span>)</h3>
            <div class="stats">
                <span>Total created</span>
                <span id="totalCreated">0</span>
            </div>
            <div id="linksList"></div>
            <button class="clear-all-btn" onclick="clearAllLinks()">🗑️ Delete All Links</button>
        </div>
    </div>

    <script>
        let links = JSON.parse(localStorage.getItem('birthdayLinks')) || [];
        let totalCreated = parseInt(localStorage.getItem('totalCreated')) || 0;

        function saveLinks() {
            localStorage.setItem('birthdayLinks', JSON.stringify(links));
            localStorage.setItem('totalCreated', totalCreated.toString());
            renderLinks();
        }

        function generateLink() {
            const name = document.getElementById('friendName').value.trim();
            const msg = document.getElementById('customMessage').value.trim();
            
            if(!name || !msg) {
                alert("Please enter both Name and Message!");
                return;
            }

            // Generate unique ID for this link
            const linkId = Date.now().toString(36) + Math.random().toString(36).substr(2, 8);
            
            const payload = { 
                id: linkId,
                n: name, 
                m: msg 
            };
            
            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            
            let baseUrl = window.location.href.split('?')[0];
            baseUrl = baseUrl.replace('index.html', '');
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            const finalLink = `${baseUrl}surprise.html?d=${encodedData}`;
            
            const linkData = {
                id: linkId,
                name: name,
                link: finalLink,
                createdAt: new Date().toLocaleString()
            };
            
            links.unshift(linkData);
            totalCreated++;
            saveLinks();
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
            
            document.getElementById('friendName').value = '';
            document.getElementById('customMessage').value = '';
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("✅ Link Copied!");
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = linkText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("✅ Link Copied!");
            });
        }

        function deleteLink(id) {
            if(confirm('🗑️ Delete this link? Link will become DEAD.')) {
                links = links.filter(link => link.id !== id);
                saveLinks();
                alert('✅ Link deleted! Now it will show "Link Expired" if opened.');
            }
        }

        function copyLinkDirect(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert("✅ Link Copied!");
            });
        }

        function clearAllLinks() {
            if(links.length === 0) {
                alert("No links to delete!");
                return;
            }
            if(confirm(`🗑️ Delete all ${links.length} links? They will become DEAD.`)) {
                links = [];
                saveLinks();
                alert('✅ All links deleted! They will show "Link Expired".');
            }
        }

        function renderLinks() {
            const listContainer = document.getElementById('linksList');
            const linkCount = document.getElementById('linkCount');
            const totalCreatedSpan = document.getElementById('totalCreated');
            
            linkCount.textContent = links.length;
            totalCreatedSpan.textContent = totalCreated;
            
            if(links.length === 0) {
                listContainer.innerHTML = '<div class="no-links">No active links yet. Generate one above! ✨</div>';
                return;
            }
            
            listContainer.innerHTML = links.map(link => `
                <div class="link-item">
                    <div class="link-info">
                        <div class="link-name">🎂 ${link.name}</div>
                        <div class="link-url">${link.link}</div>
                        <div style="font-size:0.65rem;color:rgba(255,255,255,0.3);margin-top:3px;">${link.createdAt}</div>
                    </div>
                    <div class="link-actions">
                        <button class="copy-btn" onclick="copyLinkDirect('${link.link}')">📋</button>
                        <button class="delete-btn" onclick="deleteLink('${link.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        renderLinks();
    </script>

</body>
</html>
