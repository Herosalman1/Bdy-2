<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #1b0a1d; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #2d1433; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff7eb3; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #fce7f3; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid rgba(255, 126, 179, 0.3); background: rgba(0,0,0,0.2); color: white; font-size: 1rem; outline: none; }
        input:focus, textarea:focus { border-color: #ff7eb3; box-shadow: 0 0 8px rgba(255, 126, 179, 0.3); }
        textarea { resize: vertical; height: 120px; }
        
        .btn-main { width: 100%; background: linear-gradient(90deg, #d359b3, #904dd9); border: none; padding: 15px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(211, 89, 179, 0.5); }

        .result-box { display: none; margin-top: 15px; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-group { display: flex; gap: 10px; }
        .btn-secondary { flex: 1; padding: 12px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; text-align: center; transition: 0.2s; border: none; color: white; }
        .btn-copy { background: #904dd9; }
        .btn-copy:hover { background: #7c3bc4; }
        .btn-preview { background: #d359b3; }
        .btn-preview:hover { background: #be489f; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Link Generator ✨</h2>
        
        <label>Friend's Name:</label>
        <input type="text" id="friendName" value="Salman" autocomplete="off">
        
        <label>Custom Message:</label>
        <textarea id="customMessage">Wishing you a very Happy Birthday! 🎉
May your day be filled with lots of love,
Joy, and wonderful moments. 🎂✨❤️</textarea>
        
        <!-- Hidden URL storage (No raw text shown) -->
        <input type="hidden" id="generatedUrl">

        <button class="btn-main" id="genBtn" onclick="generateLink()">Generate Link 🔗</button>

        <!-- Result Box containing Action Buttons -->
        <div id="resultBox" class="result-box">
            <div class="btn-group">
                <button id="copyBtn" class="btn-secondary btn-copy" onclick="copyLink()">Copy Link 📋</button>
                <button class="btn-secondary btn-preview" onclick="previewLink()">Click To Preview 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // Title Case function
        function toTitleCase(str) {
          return str.toLowerCase().replace(/(?:^|\s)\w/g, function(match) {
            return match.toUpperCase();
          });
        }

        // Auto format friend's name
        document.getElementById('friendName').addEventListener('input', function(e) {
          let start = this.selectionStart;
          let end = this.selectionEnd;
          this.value = toTitleCase(this.value);
          this.setSelectionRange(start, end); 
        });

        // 100% STRICT RULE 2: Robust ASCII Digit Encoder via charCodeAt
        function encodeToASCII(str) {
            if (!str) return '';
            let arr = [];
            for (let i = 0; i < str.length; i++) {
                arr.push(str.charCodeAt(i));
            }
            return arr.join('-');
        }

        function generateLink() {
            const nameInput = document.getElementById('friendName');
            const msgInput = document.getElementById('customMessage');
            const genBtn = document.getElementById('genBtn');
            const resultBox = document.getElementById('resultBox');

            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();
            
            if(!name || !msg) {
                const oldText = genBtn.innerText;
                genBtn.innerText = "Please fill both fields! ⚠️";
                genBtn.style.background = "#ff5555";
                
                setTimeout(() => {
                    genBtn.innerText = oldText;
                    genBtn.style.background = "linear-gradient(90deg, #d359b3, #904dd9)";
                }, 2000);
                resultBox.style.display = "none";
                return;
            }

            // Create JSON Object
            const payload = { n: name, m: msg };
            const payloadStr = JSON.stringify(payload);
            
            // Encode entirely into ASCII digits (Rule 2)
            const encodedHashData = encodeToASCII(payloadStr);
            const shortKey = 'bday_' + encodeToASCII(name || "friend");
            
            // Save to localStorage as Fallback (Rule 3)
            localStorage.setItem(shortKey, payloadStr);
            
            let baseUrl = window.location.href.split('?')[0].split('#')[0];
            if(baseUrl.endsWith('index.html')) {
                baseUrl = baseUrl.replace('index.html', '');
            }
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            // Setup dual fetch Link: Hash for message, Query for Name mapping
            const finalLink = `${baseUrl}surprise.html?key=${shortKey}#m=${encodedHashData}`;
            
            // Save link to hidden input (Rule 4)
            document.getElementById('generatedUrl').value = finalLink;
            resultBox.style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').value;
            const copyBtn = document.getElementById('copyBtn');

            navigator.clipboard.writeText(linkText).then(() => {
                copyBtn.innerText = "Copied! ✓";
                copyBtn.style.background = "#28a745";
                
                setTimeout(() => {
                    copyBtn.innerText = "Copy Link 📋";
                    copyBtn.style.background = "#904dd9";
                }, 2000);
            });
        }

        function previewLink() {
            const linkText = document.getElementById('generatedUrl').value;
            if(linkText) {
                window.open(linkText, '_blank');
            }
        }
    </script>
</body>
</html>
